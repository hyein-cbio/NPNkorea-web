[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "npnkorea"
version = "0.1.0"
description = "Convert between Korea's National Point Numbers and WGS84 coordinates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hyein Cho", email = "hyein.sophia.cho@gmail.com" }
]
dependencies = [
  "pyproj>=3.7"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "httpx2>=2.9"
]
api = [
  "fastapi>=0.136",
  "uvicorn>=0.46"
]

[project.scripts]
npnkorea-api = "npnkorea.web.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
