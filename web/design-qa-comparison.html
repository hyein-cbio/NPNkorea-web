<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NPNkorea design QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        grid-template-columns: 1487px 1487px;
        width: max-content;
        margin: 0;
        background: #10131a;
        color: white;
        font: 600 16px sans-serif;
      }
      figure { margin: 0; }
      figcaption { padding: 10px 16px; background: #10131a; }
      img { display: block; width: 1487px; height: 1058px; object-fit: fill; }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>Reference option 2</figcaption>
      <img src="reference-option-2.png" alt="Selected reference design" />
    </figure>
    <figure>
      <figcaption>Browser implementation</figcaption>
      <img src="implementation-option-2.png" alt="Rendered implementation" />
    </figure>
  </body>
</html>
