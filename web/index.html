<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>NPNkorea Map</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="command-bar">
        <div class="brand" aria-label="NPNkorea">
          <strong>NPN</strong><span>korea</span>
        </div>

        <div class="mode-switch" role="tablist" aria-label="변환 방식">
          <button
            id="map-mode"
            class="mode-button is-active"
            type="button"
            role="tab"
            aria-selected="true"
            data-mode="map"
          >
            <span class="material-symbols-outlined" aria-hidden="true">my_location</span>
            지도 클릭
          </button>
          <button
            id="code-mode"
            class="mode-button"
            type="button"
            role="tab"
            aria-selected="false"
            data-mode="code"
          >
            <span class="material-symbols-outlined" aria-hidden="true">search</span>
            번호 검색
          </button>
        </div>

        <form id="command-form" class="command-form" novalidate>
          <span class="material-symbols-outlined command-icon" aria-hidden="true">travel_explore</span>
          <label class="visually-hidden" for="command-input">좌표 또는 국가지점번호</label>
          <input
            id="command-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="경도, 위도 입력 또는 지도 클릭"
          />
          <button id="command-submit" class="icon-button submit-button" type="submit" aria-label="변환">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
          </button>
        </form>

        <div class="command-tools">
          <span id="connection-state" class="connection-state" role="status">
            <span class="connection-dot" aria-hidden="true"></span>
            <span id="connection-label">확인 중</span>
          </span>
          <button
            id="settings-toggle"
            class="icon-button"
            type="button"
            aria-label="API 설정"
            aria-expanded="false"
            aria-controls="settings-panel"
            title="API 설정"
          >
            <span class="material-symbols-outlined" aria-hidden="true">tune</span>
          </button>
        </div>
      </header>

      <aside id="settings-panel" class="settings-panel" hidden>
        <div class="settings-heading">
          <strong>API 연결</strong>
          <button id="settings-close" class="icon-button compact" type="button" aria-label="설정 닫기">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
          </button>
        </div>
        <label for="base-url">Backend URL</label>
        <div class="settings-row">
          <input id="base-url" type="url" value="http://127.0.0.1:8000" spellcheck="false" />
          <button id="health-button" type="button">연결 확인</button>
        </div>
      </aside>

      <main class="map-stage">
        <div id="map" aria-label="대한민국 인터랙티브 지도"></div>

        <section id="selection-card" class="selection-card" aria-live="polite" hidden>
          <div class="selection-title">
            <span>선택 위치</span>
            <strong>(10 m)</strong>
          </div>
          <dl>
            <div><dt>경도</dt><dd id="selection-lon">—</dd></div>
            <div><dt>위도</dt><dd id="selection-lat">—</dd></div>
          </dl>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </main>

      <footer id="result-dock" class="result-dock" aria-live="polite">
        <div class="coordinate-result">
          <span class="material-symbols-outlined coordinate-symbol" aria-hidden="true">language</span>
          <dl>
            <div>
              <dt>경도</dt>
              <dd><span id="result-lon">—</span><span class="coordinate-axis"> (E)</span></dd>
            </div>
            <div>
              <dt>위도</dt>
              <dd><span id="result-lat">—</span><span class="coordinate-axis"> (N)</span></dd>
            </div>
          </dl>
        </div>

        <div class="result-divider" aria-hidden="true"></div>

        <div class="npn-result">
          <span>국가지점번호</span>
          <strong id="result-code">지도를 클릭해 위치를 선택하세요</strong>
        </div>

        <div class="dock-actions">
          <button id="copy-button" class="primary-action" type="button" disabled>
            <span class="material-symbols-outlined" aria-hidden="true">content_copy</span>
            복사
          </button>
          <button id="clear-button" class="secondary-action" type="button" disabled>
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
            지우기
          </button>
        </div>
      </footer>
    </div>

    <noscript>이 지도 도구를 사용하려면 JavaScript를 활성화해야 합니다.</noscript>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
